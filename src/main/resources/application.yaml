mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: https://janus.api

smallrye:
  jwt:
    sign:
      key:
        location: privateKey.pem

quarkus:
  security:
    jwt:
      group: "USER"
      exp:
        token: 24
        refresh: 168
        session: 86400

  smallrye-jwt:
    sign:
      key:
        location: privateKey.pem
    verify:
      key:
        location: publicKey.pem
      issuer: "https://controllibrary.org"

    identity-claim: upn
    group-claim: groups

  http:
    cors:
      enabled: true
      origins: "${FRONT_URL:http://localhost:3000}"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: "*"
  banner:
    enabled: false

  datasource:
    db-kind: postgresql

  flyway:
    migrate-at-start: true
    locations: db/migrations

  shedlock:
    defaults-lock-at-most-for: PT30M
    defaults-lock-at-least-for: PT0S

janus:
  bootstrap:
    master:
      username: admin
      email: admin@gmail.com
      full-name: System Administrator
      password: MasterPassword123!
      roles:
        - admin
        - user
        - master

    roles:
      - name: MASTER
        slug: master
        description: System Master Role
        is-system: true

      - name: ADMINISTRADOR
        slug: admin
        description: System Administrator Role
        is-system: true

      - name: USER
        slug: user
        description: Standard User Role
        is-system: true

    permissions:

      # --- Users ---
      - name: "Criar Usuário"
        slug: "users:create"
        description: "Create new users in the system"
        module: "authorization"
        resource: "user"
        action: "create"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      - name: "Visualizar Usuários"
        slug: "users:read"
        description: "View user information and user lists"
        module: "authorization"
        resource: "user"
        action: "read"
        risk-level: "LOW"
        is-system: true
        is-active: true

      - name: "Atualizar Usuário"
        slug: "users:update"
        description: "Update existing user information"
        module: "authorization"
        resource: "user"
        action: "update"
        risk-level: "MEDIUM"
        is-system: true
        is-active: true

      - name: "Remover Usuário"
        slug: "users:delete"
        description: "Delete or deactivate users"
        module: "authorization"
        resource: "user"
        action: "delete"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      - name: "Personificar Usuário"
        slug: "users:impersonate"
        description: "Impersonate another user's session for support or administrative purposes"
        module: "authorization"
        resource: "user"
        action: "impersonate"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      # --- Roles ---
      - name: "Criar Papel"
        slug: "roles:create"
        description: "Create new roles in the system"
        module: "authorization"
        resource: "role"
        action: "create"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      - name: "Visualizar Papéis"
        slug: "roles:read"
        description: "List and view existing roles"
        module: "authorization"
        resource: "role"
        action: "read"
        risk-level: "LOW"
        is-system: true
        is-active: true

      - name: "Atualizar Papel"
        slug: "roles:update"
        description: "Edit role permissions and metadata"
        module: "authorization"
        resource: "role"
        action: "update"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      - name: "Remover Papel"
        slug: "roles:delete"
        description: "Remove roles from the system"
        module: "authorization"
        resource: "role"
        action: "delete"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      # --- Permissions ---
      - name: "Visualizar Permissões"
        slug: "permissions:read"
        description: "List all permissions registered in the API"
        module: "authorization"
        resource: "permission"
        action: "read"
        risk-level: "LOW"
        is-system: true
        is-active: true

      - name: "Delete Permission"
        slug: "permissions:delete"
        description: "Delete a permission from the API"
        module: "authorization"
        resource: "permission"
        action: "delete"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      - name: "Criar Permissão"
        slug: "permissions:create"
        description: "Register new permissions in the permission catalog"
        module: "authorization"
        resource: "permission"
        action: "create"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      - name: "To Update Permission"
        slug: "permissions:update"
        description: "Update permissions"
        module: "authorization"
        resource: "permission"
        action: "update"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      # --- Role Permissions ---
      - name: "Atribuir Permissão a Papel"
        slug: "role-permissions:assign"
        description: "Assign permissions to a role using ALLOW"
        module: "authorization"
        resource: "role-permission"
        action: "assign"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      - name: "Update Permission in role"
        slug: "role-permissions:update"
        description: "Update a role permission"
        module: "authorization"
        resource: "role-permission"
        action: "update"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      - name: "Revogar Permissão de Papel"
        slug: "role-permissions:revoke"
        description: "Revoke permissions from a role using DENY or removal"
        module: "authorization"
        resource: "role-permission"
        action: "revoke"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      - name: "Visualizar Permissões do Papel"
        slug: "role-permissions:read"
        description: "List permissions assigned to each role"
        module: "authorization"
        resource: "role-permission"
        action: "read"
        risk-level: "LOW"
        is-system: true
        is-active: true

      - name: "Visualizar Métricas da API"
        slug: "system:metrics:read"
        description: "Access telemetry data, health checks, and metrics"
        module: "authorization"
        resource: "system-metric"
        action: "read"
        risk-level: "LOW"
        is-system: true
        is-active: true

      # --- Audit ---
      - name: "Visualizar Auditoria"
        slug: "audit:read"
        description: "View access logs and critical actions"
        module: "audit"
        resource: "audit-log"
        action: "read"
        risk-level: "MEDIUM"
        is-system: true
        is-active: true

      # --- Export and Reports ---
      - name: "Exportar Relatórios de Auditoria"
        slug: "audit:export"
        description: "Export audit data in CSV, JSON, or PDF format"
        module: "audit"
        resource: "audit-log"
        action: "export"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      # --- Settings ---
      - name: "Visualizar Configurações do Sistema"
        slug: "system:settings:read"
        description: "View system parameters"
        module: "authorization"
        resource: "system-setting"
        action: "read"
        risk-level: "LOW"
        is-system: true
        is-active: true

      - name: "Atualizar Configurações do Sistema"
        slug: "system:settings:update"
        description: "Change global API parameters"
        module: "authorization"
        resource: "system-setting"
        action: "update"
        risk-level: "CRITICAL"
        is-system: true
        is-active: true

      # --- API Keys and Tokens ---
      - name: "Criar API Key"
        slug: "api-keys:create"
        description: "Generate new API keys for integrations"
        module: "authorization"
        resource: "api-key"
        action: "create"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      - name: "Visualizar API Keys"
        slug: "api-keys:read"
        description: "List existing API keys"
        module: "authorization"
        resource: "api-key"
        action: "read"
        risk-level: "LOW"
        is-system: true
        is-active: true

      - name: "Revogar API Key"
        slug: "api-keys:revoke"
        description: "Deactivate or delete API keys"
        module: "authorization"
        resource: "api-key"
        action: "revoke"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      # --- Assign/Revoke User Roles ---
      - name: "Atribuir Papel ao Usuário"
        slug: "user-roles:assign"
        description: "Assign a role to a user"
        module: "authorization"
        resource: "user-role"
        action: "assign"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      - name: "Revogar Papel do Usuário"
        slug: "user-roles:revoke"
        description: "Remove a role from a user"
        module: "authorization"
        resource: "user-role"
        action: "revoke"
        risk-level: "HIGH"
        is-system: true
        is-active: true

      - name: "Read Papel do Usuário"
        slug: "user-roles:read"
        description: "Read the roles assigned to a user"
        module: "authorization"
        resource: "user-role"
        action: "read"
        risk-level: "HIGH"
        is-system: true
        is-active: true

  security:
    argon2:
      iterations: 2
      memory-kb: 65536
      parallelism: 1

"%prod":
  quarkus:
    datasource:
      username: janus
      password: janus
      jdbc:
        url: jdbc:postgresql://localhost:5432/janus
        max-size: 30
        min-size: 5
        telemetry: true

"%test":
  quarkus:
    datasource:
      jdbc:
        url: ~
    flyway:
      migrate-at-start: true