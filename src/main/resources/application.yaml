mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: https://janus.api

smallrye:
  jwt:
    sign:
      key:
        location: privateKey.pem

quarkus:
  security:
    jwt:
      group: "USER"
      exp:
        token: 24
        refresh: 168

  smallrye-jwt:
    sign:
      key:
        location: privateKey.pem
    verify:
      key:
        location: publicKey.pem
      issuer: "https://controllibrary.org"

    identity-claim: upn
    group-claim: groups

  http:
    cors:
      enabled: true
      origins: "${FRONT_URL:http://localhost:3000}"
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: "*"
  banner:
    enabled: false

  datasource:
    db-kind: postgresql

  flyway:
    migrate-at-start: true
    locations: db/migrations

  shedlock:
    defaults-lock-at-most-for: PT30M
    defaults-lock-at-least-for: PT0S

janus:
  bootstrap:
    master:
      username: admin
      email: admin@gmail.com
      full-name: System Administrator
      password: MasterPassword123!
      roles:
        - admin
        - user
    roles:
      - name: MASTER
        slug: master
        description: System Master Role
        is-system: true
      - name: ADMINISTRADOR
        slug: admin
        description: System Administrator Role
        is-system: true
      - name: USER
        slug: user
        description: Standard User Role
        is-system: true

  security:
    argon2:
      iterations: 2
      memory-kb: 65536
      parallelism: 1

"%prod":
  quarkus:
    datasource:
      username: janus
      password: janus
      jdbc:
        url: jdbc:postgresql://localhost:5432/janus
        max-size: 30
        min-size: 5
        telemetry: true

"%test":
  quarkus:
    datasource:
      jdbc:
        url: ~
    flyway:
      migrate-at-start: true